<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地 SQL 检查器</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>LOCAL · SPARK SQL</span><h1>SQL 检查器</h1><p>粘贴 SQL，定位问题。所有检查在本机完成。</p></header><section><div class="toolbar"><strong>SQL 编辑区</strong><button id="example">载入示例</button></div><textarea id="sql" spellcheck="false" placeholder="在这里粘贴 DLI / Spark SQL…"></textarea><div class="toolbar"><button class="primary" id="check">检查</button><button id="format">格式化</button><button id="copy">复制 SQL</button><button id="copyreport">复制清单</button><span id="status" role="status"></span></div></section><p class="notice">支持 ${dt}、${month_1}。静态检查不能代替 DLI；字段、类型、函数签名和 join 基数需要数据库验证。点击问题可跳转原始 SQL 行。</p><section><div class="toolbar"><strong id="summary">检查结果</strong><select id="filter"><option value="all">所有级别</option><option value="error">错误</option><option value="warning">风险</option><option value="info">建议</option></select></div><div id="results"><p class="empty">输入 SQL 后点击「检查」</p></div></section></main><script src="/static/app.js"></script></body></html>
